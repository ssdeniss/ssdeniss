  <g class="in" style="animation-delay:0.50s"><line x1="690" y1="170" x2="1144" y2="170" stroke="#D2DED7"/><text x="690" y="202" class="mono" font-size="13" fill="#0B6E4F">ROLE</text><text x="820" y="203" class="sans" font-size="20" fill="#0E1713">Senior Frontend Developer</text></g><g class="in" style="animation-delay:0.60s"><line x1="690" y1="222" x2="1144" y2="222" stroke="#D2DED7"/><text x="690" y="254" class="mono" font-size="13" fill="#0B6E4F">COMPANY</text><text x="820" y="255" class="sans" font-size="20" fill="#0E1713">Urchin Systems</text></g><g class="in" style="animation-delay:0.70s"><line x1="690" y1="274" x2="1144" y2="274" stroke="#D2DED7"/><text x="690" y="306" class="mono" font-size="13" fill="#0B6E4F">EXPERIENCE</text><text x="820" y="307" class="sans" font-size="20" fill="#0E1713">Full stack since 2021</text></g><g class="in" style="animation-delay:0.80s"><line x1="690" y1="326" x2="1144" y2="326" stroke="#D2DED7"/><text x="690" y="358" class="mono" font-size="13" fill="#0B6E4F">BASED IN</text><text x="820" y="359" class="sans" font-size="20" fill="#0E1713">Chișinău, Moldova</text></g><g class="in" style="animation-delay:0.90s"><line x1="690" y1="378" x2="1144" y2="378" stroke="#D2DED7"/><text x="690" y="410" class="mono" font-size="13" fill="#0B6E4F">EDUCATION</text><text x="820" y="411" class="sans" font-size="20" fill="#0E1713">Technical University of Moldova</text></g>

