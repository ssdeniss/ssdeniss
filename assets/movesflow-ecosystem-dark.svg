</style><g class="in" style="animation-delay:0.00s"><rect x="0.5" y=".5" width="383" height="219" rx="16" fill="#12151A" stroke="#232831"/><text x="28" y="44" class="mono" font-size="13" fill="#FF7A00">MOBILE</text><text x="28" y="84" class="sans" font-size="26" font-weight="650" letter-spacing="-.5" fill="#ECEDEF">Field app for crews</text><text x="28" y="118" class="sans" font-size="16" fill="#8A929E">Orders, chat, push notifications</text><text x="28" y="142" class="sans" font-size="16" fill="#8A929E">and proof-of-delivery photos</text><line x1="28" y1="170" x2="356" y2="170" stroke="#232831"/><text x="28" y="198" class="mono" font-size="12" fill="#8A929E">REACT NATIVE · EXPO</text></g><g class="in" style="animation-delay:0.12s"><rect x="408.5" y=".5" width="383" height="219" rx="16" fill="#12151A" stroke="#232831"/><text x="436" y="44" class="mono" font-size="13" fill="#FF7A00">WEBSITE</text><text x="436" y="84" class="sans" font-size="26" font-weight="650" letter-spacing="-.5" fill="#ECEDEF">movesflow.it</text><text x="436" y="118" class="sans" font-size="16" fill="#8A929E">Italian marketing site with</text><text x="436" y="142" class="sans" font-size="16" fill="#8A929E">move-request forms</text><line x1="436" y1="170" x2="764" y2="170" stroke="#232831"/><text x="436" y="198" class="mono" font-size="12" fill="#8A929E">ASTRO · TYPESCRIPT</text></g><g class="in" style="animation-delay:0.24s"><rect x="816.5" y=".5" width="383" height="219" rx="16" fill="#12151A" stroke="#232831"/><text x="844" y="44" class="mono" font-size="13" fill="#FF7A00">LEGACY</text><text x="844" y="84" class="sans" font-size="26" font-weight="650" letter-spacing="-.5" fill="#ECEDEF">Odoo v1</text><text x="844" y="118" class="sans" font-size="16" fill="#8A929E">The original platform, built</text><text x="844" y="142" class="sans" font-size="16" fill="#8A929E">as custom Odoo 19 modules</text><line x1="844" y1="170" x2="1172" y2="170" stroke="#232831"/><text x="844" y="198" class="mono" font-size="12" fill="#8A929E">ODOO · PYTHON</text></g></svg>
