    <circle cx="846" cy="61" r="5" fill="#FF7A00"/>
    <text x="1144" y="66" class="mono" font-size="15" fill="#ECEDEF" text-anchor="end">NOW BUILDING <tspan fill="#FF7A00">MOVESFLOW.IT</tspan></text>
  </g>
  <line x1="56" y1="92" x2="1144" y2="92" stroke="#232831"/>

  <g class="sans" font-weight="700" fill="#ECEDEF" letter-spacing="-5">
    <text x="50" y="270" font-size="138" class="in" style="animation-delay:0.15s">Denis</text>
    <text x="50" y="402" font-size="138" class="in" style="animation-delay:0.30s">Șeremet<tspan fill="#FF7A00">.</tspan></text>
  </g>
  <g class="in" style="animation-delay:0.50s"><text x="780" y="232" class="mono" font-size="15" fill="#FF7A00">01</text><text x="824" y="232" class="sans" font-size="23" fill="#ECEDEF">Senior Frontend Developer</text></g><g class="in" style="animation-delay:0.62s"><text x="780" y="278" class="mono" font-size="15" fill="#FF7A00">02</text><text x="824" y="278" class="sans" font-size="23" fill="#ECEDEF">UI/UX Designer</text></g><g class="in" style="animation-delay:0.74s"><text x="780" y="324" class="mono" font-size="15" fill="#FF7A00">03</text><text x="824" y="324" class="sans" font-size="23" fill="#ECEDEF">Urchin Systems</text></g><g class="in" style="animation-delay:0.86s"><text x="780" y="370" class="mono" font-size="15" fill="#FF7A00">04</text><text x="824" y="370" class="sans" font-size="23" fill="#ECEDEF">Building MovesFlow</text></g>

  <line x1="56" y1="446" x2="1144" y2="446" stroke="#232831"/>
