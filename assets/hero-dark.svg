<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="Denis Șeremet — Senior Frontend Developer and UI/UX Designer"><title>Denis Șeremet — Senior Frontend Developer and UI/UX Designer</title><style>
  .sans { font-family: Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
  .mono { font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace; letter-spacing: .06em; }
  .in { opacity: 0; animation: in .9s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  @keyframes pulse { 0% { r: 6; opacity: .9; } 100% { r: 18; opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } }

      .orb { animation: drift 14s ease-in-out infinite alternate; transform-origin: center; }
      @keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(-120px,60px) scale(1.15); } }
      .caret { animation: blink 1.1s steps(1) infinite; }
      .ring { animation: pulse 1.8s ease-out infinite; }
    </style>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#232831" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx="35%" cy="40%" r="75%">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="m"><rect width="1200" height="520" fill="url(#fade)"/></mask>
    <radialGradient id="glow"><stop offset="0" stop-color="#FF7A00" stop-opacity=".38"/>
      <stop offset="1" stop-color="#FF7A00" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2"><stop offset="0" stop-color="#4C7BF4" stop-opacity=".30"/>
      <stop offset="1" stop-color="#4C7BF4" stop-opacity="0"/></radialGradient>
    <clipPath id="c"><rect width="1200" height="520" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1200" height="520" fill="#0B0D10"/>
    <rect width="1200" height="520" fill="url(#grid)" mask="url(#m)" opacity=".7"/>
    <circle class="orb" cx="1000" cy="110" r="300" fill="url(#glow)"/>
    <circle class="orb" cx="1120" cy="470" r="240" fill="url(#glow2)" style="animation-duration:18s"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="519" rx="24" fill="none" stroke="#232831"/>

  <text x="56" y="66" class="mono in" font-size="15" fill="#8A929E">SSDENISS / README.MD</text>
  <g class="in" style="animation-delay:0.10s">
